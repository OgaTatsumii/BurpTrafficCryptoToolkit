plugins {
    id 'java'
}

group = 'com.example.cryptomitm'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Burp at runtime -> compileOnly, not bundled.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.5'

    // Bundled into the fat jar.
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// `gradle jar` -> build/libs/crypto-mitm-template-all.jar  (load this into Burp)
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'crypto-mitm-template-all'
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
